<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>银行股买点看板</title>
<style>
  :root {
    --bg: #f2f3f7; --card: #fff; --text: #1a1d29; --sub: #6b7280;
    --up: #d32f2f; --down: #2e7d32; --line: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141c; --card: #1d2029; --text: #e8eaed; --sub: #9aa0a6; --line: #2d3140; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 12px 12px 28px; max-width: 520px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 14px; }
  h1 { font-size: 19px; font-weight: 700; }
  h1 small { display: block; font-size: 11px; color: var(--sub); font-weight: 400; margin-top: 3px; }
  #refresh { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; font-size: 14px; }
  #refresh:active { transform: scale(.96); }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .card-head .name { font-size: 17px; font-weight: 700; }
  .card-head .price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-head .chg { font-size: 13px; margin-left: 6px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .metric { background: var(--bg); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .metric .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .k { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .tier { border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 10px; }
  .t0 { background: #eceff1; color: #546e7a; }
  .t1 { background: #e3f2fd; color: #1565c0; }
  .t2 { background: #fff3e0; color: #e65100; }
  .t3 { background: #fce4ec; color: #c62828; }
  .warn { background: #f3e5f5; color: #6a1b9a; }
  @media (prefers-color-scheme: dark) {
    .t0 { background:#263238; color:#90a4ae; } .t1 { background:#0d253f; color:#64b5f6; }
    .t2 { background:#3e2b16; color:#ffb74d; } .t3 { background:#3f1d22; color:#ef9a9a; }
    .warn { background:#31183a; color:#ce93d8; }
  }
  .refs { display: flex; gap: 6px; font-size: 11.5px; color: var(--sub); }
  .refs span { flex: 1; text-align: center; background: var(--bg); border-radius: 8px; padding: 7px 2px; }
  .refs b { color: var(--text); font-variant-numeric: tabular-nums; }
  footer { text-align: center; font-size: 11px; color: var(--sub); line-height: 1.8; margin-top: 16px; }
  .err { text-align: center; color: #c62828; padding: 30px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>银行股买点看板<small id="ts">加载中…</small></h1>
  <button id="refresh" onclick="load()">刷新</button>
</header>
<div id="app"></div>
<footer>
  档位: ★建仓 股息率≥5% ｜ ★★加仓 ≥5.5%或利差≥3.5pp ｜ ★★★金坑 ≥6%<br>
  数据: 东方财富实时行情(约15秒延迟) · 10Y国债取1.68%(手动维护)<br>
  每股股息/净资产更新于2026-09 · 仅作参考, 非投资建议
</footer>
<script>
const Y10 = 0.0168;
const BANKS = [
  { code: "601398", name: "工商银行", dps: 0.3103, bps: 11.117, pbWarn: 0.74 },
  { code: "601328", name: "交通银行", dps: 0.3247, bps: 13.216, pbWarn: 0.61 },
  { code: "600919", name: "江苏银行", dps: 0.5641, bps: 14.787, pbWarn: 0.84 },
];
const fmt = (x, d = 2) => (x == null || isNaN(x)) ? "--" : x.toFixed(d);
const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";

async function load() {
  const app = document.getElementById("app");
  document.getElementById("ts").textContent = "加载中…";
  try {
    const url = "https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.601398,1.601328,1.600919&fields=f2,f3,f12,f14";
    const r = await fetch(url);
    const j = await r.json();
    const diff = j.data.diff;
    document.getElementById("ts").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
    app.innerHTML = BANKS.map(b => {
      const q = diff.find(d => d.f12 === b.code);
      const p = q ? q.f2 : null, chg = q ? q.f3 / 100 : null;
      const dv = p ? b.dps / p : null;
      const pb = p ? p / b.bps : null;
      const sp = dv != null ? dv - Y10 : null;
      let tier = 0, tag = "观望", cls = "t0";
      if (dv >= 0.06) { tier = 3; tag = "★★★ 三档·历史金坑区，可重仓"; cls = "t3"; }
      else if (dv >= 0.055 || sp >= 0.035) { tier = 2; tag = "★★ 二档·加仓区"; cls = "t2"; }
      else if (dv >= 0.05) { tier = 1; tag = "★ 一档·建仓区"; cls = "t1"; }
      else if (pb >= b.pbWarn) { tag = "▲ PB偏高(近5年95分位以上)，不宜追高"; cls = "warn"; }
      const dist = (dv && dv < 0.05) ? (b.dps / 0.05 / p - 1) : null;
      return `<div class="card">
        <div class="card-head">
          <span class="name">${b.name}</span>
          <span><span class="price">${fmt(p)}</span><span class="chg ${chg >= 0 ? "up" : "down"}">${pct(chg)}</span></span>
        </div>
        <div class="metrics">
          <div class="metric"><div class="v">${dv == null ? "--" : (dv*100).toFixed(2) + "%"}</div><div class="k">股息率TTM</div></div>
          <div class="metric"><div class="v">${fmt(pb)}</div><div class="k">市净率PB</div></div>
          <div class="metric"><div class="v">${sp == null ? "--" : (sp*100).toFixed(2) + "pp"}</div><div class="k">股债利差</div></div>
        </div>
        <div class="tier ${cls}">${tag}${dist != null ? "（距一档还需跌 " + (dist*100).toFixed(0) + "%）" : ""}</div>
        <div class="refs">
          <span>建仓 <b>${fmt(b.dps/0.05)}</b></span>
          <span>加仓 <b>${fmt(b.dps/0.055)}</b></span>
          <span>金坑 <b>${fmt(b.dps/0.06)}</b></span>
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    app.innerHTML = '<div class="err">行情加载失败，请点击"刷新"重试<br><small>' + e.message + "</small></div>";
    document.getElementById("ts").textContent = "";
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
