name: bank-monitor

# 定时监控: UTC 07:05 = 北京时间 15:05 (A股收盘后5分钟), 仅周一至周五
# 节假日由脚本内行情时间戳自动识别并跳过
on:
  schedule:
    - cron: "5 7 * * 1-5"
  workflow_dispatch: {}   # 手动触发按钮, 用于测试
  push:
    branches: [main]      # 文件更新时重新部署看板

jobs:
  monitor:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bank monitor
        run: python bank_monitor.py
        env:
          # Bark推送(iOS, 免费无限量): App Store安装Bark后复制key填入Secrets
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 备选: Server酱(每月限5条), 二者填一个即可, Bark优先
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # PUSH_MODE: alert_only=仅触发档位时推送 / always=每天收盘推送汇总(默认alert_only)
          PUSH_MODE: ${{ vars.PUSH_MODE || 'alert_only' }}

  # 实时看板部署到 GitHub Pages: https://jameswang1984.github.io/bank-monitor/
  deploy-pages:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次运行时自动启用Pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
